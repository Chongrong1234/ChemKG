  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 42
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  targets:
  - homo
  - lumo
  - delta_e
  - alpha
  - mu
  - r2
  - zpve
  - u0
  - u298
  - h298
  units:
    homo: hartree
    lumo: hartree
    delta_e: hartree
    alpha: bohr^3
    mu: debye
    r2: bohr^2
    zpve: hartree
    u0: hartree
    u298: hartree
    h298: hartree
