      cutoff: 5.0
      num_heads: 8
      distance_influence: both
  training:
    seed: 3407
    epochs: 100
    batch_size: 256
    optimizer: adamw
    lr: 0.0001
    weight_decay: 1.0e-05
    gradient_clip_val: 1.0
    target_scaling: mad
    loss: mae
    accelerator: auto
    num_workers: 4
    early_stopping:
      monitor: val_mae
      patience: 20
      min_delta: 1.0e-05
  evaluation:
    metrics:
    - mae
    - rmse
    - mape
    - r2
  output:
    root: outputs/paired_gap_mae_v2
    save_predictions: true
    save_model: true
data:
  smiles_column: smiles
  id_column: sample_id
