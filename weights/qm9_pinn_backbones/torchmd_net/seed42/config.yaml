status: implemented_pending_gpu_smoke
experiment:
  name: torchmd_net_physics_thermo10
  model_id: torchmd_net_physics_thermo10
  protocol_id: qm9_modular_fresh200_v1
backbone:
  model: torchmd_net
  family: transformer
  input: 3D
source_config: configs/qm9_models/torchmd_net.yaml
source:
  experiment:
    name: torchmd_net_qm9
    model_type: torchmd_net
  data:
    processed_dir: data/processed/qm9_full/random/seed3407
    geometry: data/geometry/qm9_full_seed3407.npz
    smiles_column: smiles
    id_column: sample_id
    target_column: delta_e
    targets:
    - delta_e
    label_unit: hartree
    split:
      method: random
      sizes:
      - 0.8
      - 0.1
      - 0.1
      seed: 3407
      stratify:
        strategy: quantile
        column: delta_e
        bins: 200
  model:
    name: torchmd_net
    params:
      architecture: equivariant-transformer
      embedding_dimension: 128
      num_layers: 6
      num_rbf: 50
      rbf_type: expnorm
      trainable_rbf: false
