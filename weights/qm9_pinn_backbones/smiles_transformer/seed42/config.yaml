status: implemented_pending_gpu_smoke
experiment:
  name: smiles_transformer_physics_thermo10
  model_id: smiles_transformer_physics_thermo10
  protocol_id: qm9_modular_fresh200_v1
backbone:
  model: smiles_transformer
  family: transformer
  input: 2D
source_config: configs/transformer.yaml
source:
  experiment:
    name: exp005_smiles_transformer
    type: smiles_transformer
  data:
    processed_dir: data/processed/qm9_full/random/seed3407
    chemprop_reference_config: configs/baseline.yaml
    smiles_column: smiles
    id_column: sample_id
    target_column: delta_e
    targets:
    - delta_e
    label_unit: hartree
    split:
      method: random
      sizes:
      - 0.8
      - 0.1
      - 0.1
      seed: 3407
      stratify:
        strategy: quantile
        column: delta_e
        bins: 200
  tokenizer:
    pattern: (\[[^\]]+\]|Br?|Cl?|N|O|S|P|F|I|b|c|n|o|s|p|\(|\)|\.|=|#|-|\+|\\|\/|:|~|@|\?|>>?|\*|\$|\%[0-9]{2}|[0-9])
    special_tokens:
      pad: '[PAD]'
      unk: '[UNK]'
      cls: '[CLS]'
    vocabulary_source: train
    max_length: 40
    overlength_policy: error
  model:
    d_model: 256
    num_layers: 4
    num_heads: 8
    dim_feedforward: 512
    dropout: 0.1
    activation: gelu
    pooling: cls
    regression_hidden_dim: 128
    min_parameters: 1000000
    max_parameters: 5000000
  training:
    batch_size: 256
    epochs: 100
    optimizer: adamw
    lr: 0.0003
    weight_decay: 0.01
    warmup_ratio: 0.1
    min_lr_ratio: 0.1
    gradient_clip_val: 1.0
    target_scaling: standard
    early_stopping_patience: 20
    early_stopping_min_delta: 1.0e-05
    seed: 3407
    accelerator: auto
    devices: 1
    precision: 32-true
    num_workers: 8
    pin_memory: true
    log_every_n_steps: 50
  evaluation:
    metrics:
    - mae
    - rmse
    - mape
    - r2
  output:
    root: outputs
data:
  smiles_column: smiles
  id_column: sample_id
  processed_dir: data/processed/qm9_thermo10_v1/random/seed42
  split:
    method: random
    sizes:
    - 0.8
    - 0.1
    - 0.1
    seed: 42
    stratify:
      strategy: quantile
      column: delta_e
      bins: 200
  targets:
  - homo
  - lumo
  - delta_e
  - alpha
  - mu
  - r2
  - zpve
  - u0
  - u298
  - h298
  units:
    homo: hartree
    lumo: hartree
    delta_e: hartree
    alpha: bohr^3
    mu: debye
    r2: bohr^2
    zpve: hartree
    u0: hartree
    u298: hartree
    h298: hartree
  selection_target: delta_e
training:
  epochs: 200
  batch_size: 256
  patience: 20
  min_delta: 0.0
  checkpoint_every_n_epochs: 50
  seed: 42
  split_seed: 42
  run_mode: paired_split_seed
  seed_pairing: matched
  num_workers: 2
  pin_memory: true
  target_scaling: train_only_per_target_zscore
  supervised_loss: mse
  selection_metric: val_delta_e_mae
module:
  variant: physics_thermo10
  hidden_dim: 128
  num_heads: 4
  dropout: 0.1
  physics:
    kbt_hartree: 0.000944186
    gap_tolerance_hartree: 0.0001
    enthalpy_tolerance_hartree: 1.0e-06
    scale_floor_hartree: 1.0e-08
    warmup_epochs: 10
    ramp_epochs: 10
    weight: 0.1
output:
  root: artifacts/qm9_epoch200/fresh
evaluation:
  report_tasks:
  - homo
  - lumo
  - delta_e
  - alpha
  - mu
  - r2
  - zpve
  metrics:
  - mae
  - mse
  - rmse
  - r2
  original_units: true
